general_reddit_sources:
  - "wallstreetbets"
  - "investing"
  - "stocks"
  - "options"

# --- List of specific assets to track ---
assets:
  - name: "Bitcoin"
    ticker: "BTC-USD"
    # Keywords to search for during NER
    keywords: ["bitcoin", "btc"]
    # Asset-specific subreddits
    reddit_subreddits: ["bitcoin", "btc", "CryptoCurrency"]
